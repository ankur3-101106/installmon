name: Multi-Architecture Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 (Intel / AMD 64-bit) - Statically linked with musl for universal compatibility
          - target: x86_64-unknown-linux-musl
            binary_name: installmon-linux-x86_64
            use_cross: true

          # aarch64 (ARM 64-bit / Raspberry Pi 4/5 / Apple Silicon Linux / AWS Graviton)
          - target: aarch64-unknown-linux-musl
            binary_name: installmon-linux-aarch64
            use_cross: true

          # armv7 (ARM 32-bit Hard-Float / Raspberry Pi 2/3)
          - target: armv7-unknown-linux-musleabihf
            binary_name: installmon-linux-armv7
            use_cross: true

          # riscv64 (RISC-V 64-bit)
          - target: riscv64gc-unknown-linux-gnu
            binary_name: installmon-linux-riscv64
            use_cross: true

          # powerpc64le (PowerPC 64-bit Little Endian)
          - target: powerpc64le-unknown-linux-gnu
            binary_name: installmon-linux-powerpc64le
            use_cross: true

          # s390x (IBM System z / Mainframe)
          - target: s390x-unknown-linux-gnu
            binary_name: installmon-linux-s390x
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool (cross)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary with cross
        run: |
          cross build --release --target ${{ matrix.target }} --bin installmon

      - name: Prepare standalone binary
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/installmon staging/${{ matrix.binary_name }}
          chmod +x staging/${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collate Release Binaries & SHA256SUMS
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "installmon-linux-*" -exec cp {} release-dist/ \;
          chmod +x release-dist/*
          cd release-dist
          sha256sum installmon-linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v0.1.0"
          fi
          gh release create "$TAG_NAME" release-dist/* \
            --title "InstallMon $TAG_NAME" \
            --notes "InstallMon $TAG_NAME - Linux Software Installation Monitoring & Auditing System. Includes interactive Ratatui TUI and statically linked universal Linux binaries." \
            --draft=false || gh release upload "$TAG_NAME" release-dist/* --clobber
