name: Multi-Architecture Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 (Intel / AMD 64-bit) - Statically linked with musl for universal compatibility
          - target: x86_64-unknown-linux-musl
            name: installmon-v0.1.0-linux-x86_64.tar.gz
            use_cross: true

          # aarch64 (ARM 64-bit / Raspberry Pi 4/5 / Apple Silicon Linux / AWS Graviton)
          - target: aarch64-unknown-linux-musl
            name: installmon-v0.1.0-linux-aarch64.tar.gz
            use_cross: true

          # armv7 (ARM 32-bit Hard-Float / Raspberry Pi 2/3)
          - target: armv7-unknown-linux-musleabihf
            name: installmon-v0.1.0-linux-armv7.tar.gz
            use_cross: true

          # riscv64 (RISC-V 64-bit)
          - target: riscv64gc-unknown-linux-gnu
            name: installmon-v0.1.0-linux-riscv64.tar.gz
            use_cross: true

          # powerpc64le (PowerPC 64-bit Little Endian)
          - target: powerpc64le-unknown-linux-gnu
            name: installmon-v0.1.0-linux-powerpc64le.tar.gz
            use_cross: true

          # s390x (IBM System z / Mainframe)
          - target: s390x-unknown-linux-gnu
            name: installmon-v0.1.0-linux-s390x.tar.gz
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool (cross)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary with cross
        run: |
          cross build --release --target ${{ matrix.target }} --bin installmon

      - name: Package release archive
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/installmon staging/
          cp README.md LICENSE staging/
          tar -czvf ${{ matrix.name }} -C staging installmon README.md LICENSE
          sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collate SHA256SUMS
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "*.tar.gz" -exec cp {} release-dist/ \;
          find release-artifacts -type f -name "*.sha256" -exec cat {} + > release-dist/SHA256SUMS
          cd release-dist && sha256sum --check SHA256SUMS || true

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v0.1.0"
          fi
          gh release create "$TAG_NAME" release-dist/* \
            --title "InstallMon $TAG_NAME" \
            --notes "InstallMon $TAG_NAME - Linux Software Installation Monitoring & Auditing System. Includes interactive Ratatui TUI and statically linked universal Linux binaries." \
            --draft=false || gh release upload "$TAG_NAME" release-dist/* --clobber
